# Mustang head unit — included from ~/.config/sway/config (installed by system/deploy.sh)

# Kiosk look: true 2880x1920 pixels, no borders, gaps or bar. Apps scale themselves
# (Chromium uses --force-device-scale-factor=2).
output * scale 1
default_border none
default_floating_border none
gaps inner 0
gaps outer 0

# OpenAuto, kept alive and restarted after unplug/crash (see aa-supervisor).
exec aa-supervisor > /tmp/aa-supervisor.log 2>&1
# Bridge between the shell and Sway/hardware; owns Android Auto window placement.
exec hu-daemon > /tmp/hu-daemon.log 2>&1
# The React shell in Chromium; it is the only tiled window and fills the screen.
exec hu-shell > /tmp/hu-shell.log 2>&1

# Hardware keys: Surface volume buttons and the keyboard's media/brightness keys.
# hu-daemon polls both values, so the shell's sliders follow these changes.
# --no-warn: these replace the same keys bound in the default /etc/sway/config.
bindsym --locked --no-warn XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked --no-warn XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked --no-warn XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked --no-warn XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --locked --no-warn XF86MonBrightnessDown exec brightnessctl -n 1% set 5%-
