# Mustang head unit — included from ~/.config/sway/config (installed by system/deploy.sh)

# Kiosk look: true 2880x1920 pixels, no borders, gaps or bar. Apps scale themselves
# (Chromium uses --force-device-scale-factor=2).
output * scale 1
default_border none
default_floating_border none
gaps inner 0
gaps outer 0

# OpenAuto, kept alive and restarted after unplug/crash (see aa-supervisor).
exec aa-supervisor > /tmp/aa-supervisor.log 2>&1
# Bridge between the shell and Sway/hardware; owns Android Auto window placement.
exec hu-daemon > /tmp/hu-daemon.log 2>&1
# The React shell in Chromium; it is the only tiled window and fills the screen.
exec hu-shell > /tmp/hu-shell.log 2>&1
# On-screen keyboard (shown by the dock's keyboard button, or automatically on
# text fields in web apps). Controlled over D-Bus by hu-daemon.
exec squeekboard > /tmp/squeekboard.log 2>&1
