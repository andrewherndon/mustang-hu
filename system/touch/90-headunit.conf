# Head unit (Surface Pro 11, 045E:0C80): keep fingers tracked through fast drags and pinches.
# Defaults dropped contacts for ~10 ms mid-gesture, which Android Auto reads as lift + new touch.
# Revert: delete this file and run: sudo systemctl restart "iptsd@*"
[Contacts]
ActivationThreshold = 18
DeactivationThreshold = 12
SizeMin = 0.15
AspectMax = 3.5
